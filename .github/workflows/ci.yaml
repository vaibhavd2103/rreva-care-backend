name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MONGODB_URL: mongodb://localhost:27017/testdb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        # for pnpm/yarn change accordingly
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # - name: Run lint
      #   run: npm run lint

      # - name: Type check
      #   run: npm run typecheck

      # - name: Run tests
      #   run: npm test
